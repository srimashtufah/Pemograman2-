<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Hotel Dashboard Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }
        .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 20px; color: white; }
        .text-neon { color: #22d3ee; text-shadow: 0 0 10px rgba(34, 211, 238, 0.5); }
        .btn-neon { background: #22d3ee; border: none; font-weight: bold; color: #0f172a; }
        .table { color: #cbd5e1; }
        .table thead { background: #334155; color: #fff; }
        .sidebar-style { border-right: 1px solid #334155; }
    </style>
</head>
<body>
    <div class="container-fluid py-5">
        <div class="row px-4">
            <div class="col-12 mb-4 text-center">
                <h1 class="text-neon fw-bold"><i class="fa-solid fa-moon me-3"></i>CYBER HOTEL RESERVATION</h1>
                <div class="mt-3 badge bg-dark p-3 fs-6">Sisa Kamar: <span class="text-neon" th:text="${sisaKamar}">5</span></div>
            </div>

            <div class="col-lg-3">
                <div class="card p-4">
                    <h5 class="mb-4 text-neon"><i class="fa-solid fa-pen-to-square me-2"></i>Entry Data</h5>
                    <form th:action="@{/simpan}" th:object="${reservasiBaru}" method="POST">
                        <input type="hidden" th:field="*{id}" />
                        <div class="mb-3"><input type="text" th:field="*{namaTamu}" class="form-control bg-dark text-white border-0" placeholder="Nama Tamu"></div>
                        <div class="mb-3"><select th:field="*{tipeKamar}" class="form-select bg-dark text-white border-0">
                            <option value="Standard Room">Standard</option>
                            <option value="Deluxe Room">Deluxe</option>
                            <option value="Suite Room">Suite</option>
                        </select></div>
                        <div class="mb-3"><input type="date" th:field="*{tanggalCheckIn}" class="form-control bg-dark text-white border-0"></div>
                        <div class="mb-3"><input type="date" th:field="*{tanggalCheckOut}" class="form-control bg-dark text-white border-0"></div>
                        <button type="submit" class="btn btn-neon w-100">CONFIRM BOOKING</button>
                    </form>
                </div>
            </div>

            <div class="col-lg-9">
                <div class="card p-4">
                    <table class="table table-hover">
                        <thead><tr><th>ID</th><th>Tamu</th><th>Kamar</th><th>In</th><th>Out</th><th>Action</th></tr></thead>
                        <tbody>
                            <tr th:each="res : ${daftarReservasi}">
                                <td th:text="'#' + ${res.id}"></td>
                                <td th:text="${res.namaTamu}"></td>
                                <td th:text="${res.tipeKamar}"></td>
                                <td th:text="${res.tanggalCheckIn}"></td>
                                <td th:text="${res.tanggalCheckOut}"></td>
                                <td>
                                    <a th:href="@{/edit/{id}(id=${res.id})}" class="text-info me-3"><i class="fa-solid fa-edit"></i></a>
                                    <a th:href="@{/hapus/{id}(id=${res.id})}" class="text-danger"><i class="fa-solid fa-trash"></i></a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
